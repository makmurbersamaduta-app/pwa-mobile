<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pelanggaran</title>

    <!-- ============================================================
         KELOMPOK 1: HEAD PWA & STYLE
         PERLU DISAMAKAN: salin tag <meta> / <link> PWA (theme-color, manifest, ikon)
         dari <head> halaman PWA Anda yang sudah berjalan. Path CSS disalin dari inspeksi.html.
         Kelas proyek (app-container, page-header, back-btn, memo-list) tetap dipakai agar
         header sama dengan halaman lain. Semua gaya baru memakai awalan "plg-".
         ============================================================ -->
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --plg-primary: #2b6cb0;
            --plg-primary-dark: #1e4e8c;
            --plg-soft: #e1ecf5;
            --plg-border: #d3dfea;
            --plg-text: #1f2d3d;
            --plg-muted: #6b7c93;
            --plg-danger: #d64545;
        }

        /* Header: tombol "Buat Inspeksi" di kanan */
        .plg-page .page-header { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); }
        .plg-page .page-header .back-btn { font-size: 1.1rem; color: var(--dark-color); }
        .plg-page .page-header h1 { font-size: 1rem; font-weight: 700; color: var(--dark-color); }
        .plg-btn-new { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; background: var(--plg-primary); color: #fff; font-size: 13px; font-weight: 600; font-family: inherit; }
        .plg-btn-new:disabled { opacity: 0.5; }

        /* Daftar kartu */
        .plg-list { padding: 12px 14px 90px; }
        .plg-card { background: #fff; border: 1px solid var(--plg-border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; box-shadow: 0 1px 3px rgba(31, 45, 61, 0.06); }
        .plg-card:active { background: #f4f7fb; }
        .plg-card-title { font-size: 14.5px; font-weight: 700; color: var(--plg-text); word-break: break-word; }
        .plg-card-meta { margin-top: 6px; font-size: 12.5px; color: var(--plg-muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .plg-empty, .plg-loading { text-align: center; padding: 40px 16px; color: var(--plg-muted); font-size: 14px; }
        .plg-more { display: block; width: 100%; margin: 6px 0 0; padding: 10px; border: 1px solid var(--plg-border); border-radius: 10px; background: #fff; color: var(--plg-primary-dark); font-weight: 600; font-family: inherit; }

        /* Modal layar penuh */
        .plg-modal { position: fixed; inset: 0; z-index: 1000; display: none; flex-direction: column; background: #f4f7fb; }
        .plg-modal.open { display: flex; }
        .plg-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; background: #fff; border-bottom: 1px solid var(--plg-border); }
        .plg-modal-title { margin: 0; font-size: 16px; font-weight: 700; color: var(--plg-text); }
        .plg-x { border: none; background: none; font-size: 20px; color: var(--plg-muted); padding: 4px 8px; }
        .plg-modal-body { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
        .plg-modal-foot { display: flex; gap: 10px; justify-content: flex-end; flex-shrink: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--plg-border); }
        .plg-btn { border: 1px solid var(--plg-border); background: #fff; color: var(--plg-text); border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; font-family: inherit; }
        .plg-btn.primary { background: var(--plg-primary); border-color: var(--plg-primary); color: #fff; }
        .plg-btn:disabled { opacity: 0.6; }
        [hidden] { display: none !important; }

        /* Isian form */
        .plg-field { margin-bottom: 14px; }
        .plg-label { display: block; font-size: 12px; font-weight: 600; color: var(--plg-muted); margin-bottom: 4px; }
        .plg-input { width: 100%; border: 1px solid var(--plg-border); border-radius: 8px; padding: 10px; font-size: 14px; background: #fff; color: var(--plg-text); outline: none; font-family: inherit; }
        .plg-input:focus { border-color: var(--plg-primary); }
        .plg-input[readonly], .plg-input:disabled { background: #eef2f6; }
        textarea.plg-input { min-height: 96px; resize: vertical; }
        .plg-msg { border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; white-space: pre-line; }
        .plg-msg.danger { background: #fdecec; color: #9b1c1c; }
        .plg-msg.info { background: #e1ecf5; color: #1e4e8c; }
        .plg-hint { font-size: 12px; color: var(--plg-muted); margin-top: 6px; }

        .plg-toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 1200; background: #1f2d3d; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; max-width: 90vw; text-align: center; display: none; }

        /* --- Tambahan halaman pelanggaran --- */
        .plg-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .plg-dept { display: inline-block; margin-bottom: 6px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--plg-soft); color: var(--plg-primary-dark); }
        .plg-badge { flex-shrink: 0; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
        .plg-badge.sp1 { background: #fef3c7; color: #92400e; }
        .plg-badge.sp2 { background: #fde4cf; color: #9a3412; }
        .plg-badge.sp3 { background: #fdecec; color: #9b1c1c; }
        .plg-rel { position: relative; }
        .plg-suggest { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--plg-border); border-radius: 8px; box-shadow: 0 8px 24px rgba(31, 45, 61, 0.18); max-height: 240px; overflow-y: auto; }
        .plg-suggest-item { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #eef2f6; }
        .plg-suggest-item:last-child { border-bottom: none; }
        .plg-suggest-item:active { background: var(--plg-soft); }
        .plg-suggest-item.disabled { color: var(--plg-muted); background: #fafbfc; }
        .plg-suggest-item small { display: block; color: var(--plg-muted); font-size: 12px; margin-top: 1px; }
        .plg-chosen { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--plg-primary); background: var(--plg-soft); border-radius: 8px; padding: 9px 10px; font-size: 14px; font-weight: 600; word-break: break-word; }
        .plg-chosen button { border: none; background: none; color: var(--plg-muted); font-size: 18px; padding: 0 4px; }
        .plg-alert { border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; white-space: pre-line; line-height: 1.5; }
        .plg-alert.info { background: #e1ecf5; color: #1e4e8c; }
        .plg-alert.warn { background: #fef3c7; color: #92400e; }
        .plg-alert.danger { background: #fdecec; color: #9b1c1c; }
        .plg-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .plg-input { box-sizing: border-box; }
        .plg-two > .plg-field { min-width: 0; }
        input[type="date"].plg-input { min-height: 40px; min-width: 0; }
    </style>
</head>
<body>

    <!-- ============================================================
         KELOMPOK 2: HEADER & DAFTAR KARTU
         Fungsi: tombol kembali, judul "Pelanggaran", tombol "Surat Peringatan"
         (membuka modal pengisian). Kartu diisi dinamis oleh pelanggaran.js.
         PERLU DICEK: tujuan tombol kembali.
         ============================================================ -->
    <div class="app-container plg-page">
        <header class="page-header">
            <a href="../laporan.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h1>Pelanggaran</h1>
            <button type="button" class="plg-btn-new" id="btnBuat"><i class="fa-solid fa-plus"></i> Surat Peringatan</button>
        </header>

        <div class="memo-list plg-list" id="plgList">
            <!-- Diisi dinamis oleh pelanggaran.js -->
        </div>
    </div>

    <!-- ============================================================
         KELOMPOK 3: MODAL SURAT PERINGATAN (Buat / Detail / Edit)
         Fungsi: satu modal layar penuh untuk tiga mode (diatur JS):
           - Buat   : cari karyawan, Jenis Peringatan (saran otomatis), Jenis Pelanggaran,
                      Deskripsi, Start Date, End Date (+6 bulan)
           - Detail : isi yang sama, hanya baca; tombol Edit jika masih H-1
           - Edit   : Jenis Pelanggaran, Deskripsi, dan Start Date bisa diubah
         Data di belakang layar (cabang, departemen, area, bagian, petugas, NIK) terisi otomatis.
         ============================================================ -->
    <div class="plg-modal" id="plgModal" role="dialog" aria-modal="true">
        <div class="plg-modal-head">
            <h2 class="plg-modal-title" id="plgTitle">Surat Peringatan</h2>
            <button type="button" class="plg-x" id="plgBtnX" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="plg-modal-body" id="plgBody">
            <div class="plg-alert" id="plgMsg" hidden></div>

            <div class="plg-field plg-rel">
                <label class="plg-label" for="pEmpSearch">Nama Karyawan</label>
                <input type="text" class="plg-input" id="pEmpSearch" placeholder="Ketik nama atau NIK (min. 2 huruf)" autocomplete="off">
                <div class="plg-chosen" id="pEmpChosen" hidden>
                    <span id="pEmpChosenText"></span>
                    <button type="button" id="btnEmpClear" aria-label="Ganti karyawan"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <input type="text" class="plg-input" id="pEmpTxt" readonly hidden>
                <div class="plg-suggest" id="pEmpList" hidden></div>
            </div>

            <div class="plg-alert info" id="pSpInfo" hidden></div>

            <div class="plg-field">
                <label class="plg-label" for="pSp">Jenis Peringatan</label>
                <select class="plg-input" id="pSp" disabled><option value="">Pilih karyawan dulu</option></select>
                <input type="text" class="plg-input" id="pSpTxt" readonly hidden>
            </div>
            <div class="plg-field">
                <label class="plg-label" for="pJenis">Jenis Pelanggaran</label>
                <select class="plg-input" id="pJenis"></select>
                <input type="text" class="plg-input" id="pJenisTxt" readonly hidden>
            </div>
            <div class="plg-field">
                <label class="plg-label" for="pDesc">Deskripsi Pelanggaran</label>
                <textarea class="plg-input" id="pDesc" maxlength="1000"></textarea>
            </div>
            <div class="plg-two">
                <div class="plg-field">
                    <label class="plg-label" for="pStart">Start Date</label>
                    <input type="date" class="plg-input" id="pStart">
                </div>
                <div class="plg-field">
                    <label class="plg-label" for="pEnd">End Date (+6 bulan)</label>
                    <input type="date" class="plg-input" id="pEnd" readonly>
                </div>
            </div>
            <div class="plg-hint" id="pHint"></div>
        </div>

        <div class="plg-modal-foot">
            <button type="button" class="plg-btn" id="plgBtnTutup" hidden>Tutup</button>
            <button type="button" class="plg-btn" id="plgBtnBatal" hidden>Batal</button>
            <button type="button" class="plg-btn primary" id="plgBtnEdit" hidden><i class="fa-solid fa-pen"></i> Edit</button>
            <button type="button" class="plg-btn primary" id="plgBtnSimpan" hidden><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
        </div>
    </div>

    <div class="plg-toast" id="plgToast"></div>

    <!-- ============================================================
         KELOMPOK 4: SCRIPT
         PERLU DICEK: path supabase.js dan pelanggaran.js. Samakan dengan
         halaman PWA lain yang sudah berjalan (mis. inspeksi.html).
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/report/pelanggaran.js"></script>
</body>
</html>
