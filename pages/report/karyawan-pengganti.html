<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Karyawan Pengganti</title>

    <!-- ============================================================
         KELOMPOK 1: HEAD PWA & STYLE
         Fungsi: meta PWA, CSS proyek, dan semua gaya halaman (awalan "kp-").
         Tampilan mengikuti halaman Permintaan Barang (header + tombol di kanan + kartu).
         Responsif: HP = modal naik dari bawah; tablet/iPad (>= 768px) = modal di tengah,
         halaman lebih lebar, isian dua kolom. Kolom isian 16px agar iPhone/iPad tidak
         memperbesar layar sendiri saat mengetik.
         PERLU DICEK: path ../../ disalin dari permintaan-barang.html.
         ============================================================ -->
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#2b6cb0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --kp-primary: #2b6cb0;
            --kp-primary-dark: #1e4e8c;
            --kp-soft: #e1ecf5;
            --kp-border: #d3dfea;
            --kp-text: #1f2d3d;
            --kp-muted: #6b7c93;
            --kp-danger: #d64545;
        }
        [hidden] { display: none !important; }

        /* --- Header: judul + tombol "+ Pengganti" di kanan --- */
        .kp-page .page-header { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); }
        .kp-page .page-header .back-btn { font-size: 1.1rem; color: var(--dark-color); }
        .kp-page .page-header h1 { font-size: 1rem; font-weight: 700; color: var(--dark-color); }
        .kp-btn-new { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: var(--kp-primary); color: #fff; font-size: 13px; font-weight: 600; font-family: inherit; }
        .kp-btn-new:disabled { opacity: 0.5; }

        /* --- Daftar kartu, dikelompokkan per tanggal (terbaru di atas) --- */
        .kp-list { padding: 12px 14px 90px; }
        .kp-group { margin: 14px 2px 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--kp-muted); }
        .kp-group:first-child { margin-top: 2px; }
        .kp-card { background: #fff; border: 1px solid var(--kp-border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; box-shadow: 0 1px 3px rgba(31, 45, 61, 0.06); }
        .kp-card:active { background: #f4f7fb; }
        .kp-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .kp-card-title { font-size: 14.5px; font-weight: 700; color: var(--kp-text); word-break: break-word; }
        .kp-card-meta { margin-top: 5px; font-size: 12.5px; color: var(--kp-muted); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; word-break: break-word; }
        .kp-card-meta i { width: 14px; text-align: center; flex-shrink: 0; }
        .kp-tag { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--kp-soft); color: var(--kp-primary-dark); }
        .kp-tag.lembur { background: #fef3c7; color: #92400e; }
        .kp-empty, .kp-loading { text-align: center; padding: 40px 16px; color: var(--kp-muted); font-size: 14px; }
        .kp-more { display: block; width: 100%; margin: 6px 0 0; padding: 10px; border: 1px solid var(--kp-border); border-radius: 10px; background: #fff; color: var(--kp-primary-dark); font-weight: 600; font-family: inherit; font-size: 14px; }

        /* --- Modal (bottom sheet di HP, dialog di tablet) --- */
        .kp-modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: flex-end; justify-content: center; background: rgba(15, 23, 42, 0.55); }
        .kp-modal.open { display: flex; }
        .kp-modal.kp-top { z-index: 1100; }
        .kp-sheet { display: flex; flex-direction: column; width: 100%; max-width: 640px; max-height: 94vh; max-height: 94dvh; background: #f4f7fb; border-radius: 16px 16px 0 0; overflow: hidden; }
        .kp-sheet-head { display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding: 14px 16px; background: #fff; border-bottom: 1px solid var(--kp-border); }
        .kp-sheet-title { margin: 0; flex: 1; font-size: 16px; font-weight: 700; color: var(--kp-text); }
        .kp-icon-btn { border: none; background: none; font-size: 18px; color: var(--kp-muted); padding: 4px 8px; cursor: pointer; }
        .kp-link-btn { border: none; background: none; color: var(--kp-primary-dark); font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }
        .kp-link-btn:disabled { opacity: 0.4; }
        .kp-sheet-body { flex: 1; overflow-y: auto; padding: 14px 16px; -webkit-overflow-scrolling: touch; }
        .kp-sheet-foot { display: flex; flex-direction: column-reverse; gap: 10px; flex-shrink: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--kp-border); }
        .kp-btn { width: 100%; border: 1px solid var(--kp-border); background: #fff; color: var(--kp-text); border-radius: 8px; padding: 13px 20px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; }
        .kp-btn.primary { background: var(--kp-primary); border-color: var(--kp-primary); color: #fff; }
        .kp-btn:disabled { opacity: 0.6; }

        /* --- Isian form --- */
        .kp-field { margin-bottom: 14px; }
        .kp-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--kp-muted); margin-bottom: 4px; }
        .kp-req { color: var(--kp-danger); }
        .kp-input { width: 100%; box-sizing: border-box; border: 1px solid var(--kp-border); border-radius: 8px; padding: 10px; font-size: 16px; background: #fff; color: var(--kp-text); outline: none; font-family: inherit; min-height: 42px; }
        .kp-input:focus { border-color: var(--kp-primary); }
        .kp-input:disabled, .kp-input[readonly] { background: #fff; }
        .kp-input:disabled { background: #eef2f6; color: var(--kp-text); opacity: 1; }
        .kp-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .kp-two > .kp-field { min-width: 0; }
        .kp-msg { border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; white-space: pre-line; line-height: 1.45; }
        .kp-msg.danger { background: #fdecec; color: #9b1c1c; }
        .kp-msg.info { background: #e1ecf5; color: #1e4e8c; }
        .kp-msg.warn { background: #fef3c7; color: #92400e; }
        .kp-hint { font-size: 12px; color: var(--kp-muted); margin-top: 5px; }

        /* --- Kolom ketuk (tanggal) dan dropdown dengan kolom cari --- */
        .kp-tap { position: relative; cursor: pointer; }
        .kp-tap .kp-input { padding-right: 40px; cursor: pointer; }
        .kp-tap-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--kp-muted); font-size: 16px; pointer-events: none; }
        .kp-tap.kp-off { pointer-events: none; opacity: 0.7; }
        .kp-combo { position: relative; }
        .kp-combo-panel { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; background: #fff; border: 1px solid var(--kp-border); border-radius: 10px; box-shadow: 0 8px 24px rgba(31, 45, 61, 0.18); padding: 8px; }
        .kp-combo-list { max-height: 220px; overflow-y: auto; margin-top: 6px; -webkit-overflow-scrolling: touch; }
        .kp-combo-item { padding: 10px; font-size: 14px; border-radius: 6px; cursor: pointer; word-break: break-word; }
        .kp-combo-item:active, .kp-combo-item.sel { background: var(--kp-soft); }
        .kp-combo-empty { padding: 10px; font-size: 13px; color: var(--kp-muted); }

        /* --- Kalender pemilih tanggal --- */
        .kp-cal { background: #fff; border: 1px solid var(--kp-border); border-radius: 10px; padding: 10px; }
        .kp-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .kp-cal-title { font-size: 14.5px; font-weight: 700; color: var(--kp-text); }
        .kp-cal-nav { width: 36px; height: 36px; border: none; border-radius: 8px; background: var(--kp-soft); color: var(--kp-primary-dark); cursor: pointer; }
        .kp-cal table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .kp-cal th { padding: 6px 0; font-size: 11.5px; font-weight: 600; color: var(--kp-muted); text-align: center; }
        .kp-cal td { padding: 2px 0; text-align: center; }
        .kp-day { width: 38px; height: 38px; border: none; border-radius: 50%; background: transparent; color: var(--kp-text); font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
        .kp-day.today { font-weight: 800; color: var(--kp-primary-dark); box-shadow: inset 0 0 0 1px var(--kp-primary); }
        .kp-day.sel { background: var(--kp-primary); color: #fff; box-shadow: none; }
        .kp-day:disabled { color: #b8c4d2; font-weight: 400; cursor: not-allowed; }

        .kp-toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 1200; background: #1f2d3d; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; max-width: 90vw; text-align: center; display: none; }

        /* --- Tablet / iPad --- */
        @media (min-width: 768px) {
            .kp-page.app-container { max-width: 760px; }
            .kp-list { padding: 16px 20px 90px; }
            .kp-modal { align-items: center; }
            .kp-sheet { border-radius: 16px; max-height: 88vh; max-height: 88dvh; }
            .kp-sheet-body { padding: 18px 22px; }
            .kp-sheet-foot { flex-direction: row; justify-content: flex-end; }
            .kp-btn { width: auto; }
            .kp-day { width: 44px; height: 44px; font-size: 15px; }
        }
        @media (max-height: 480px) { .kp-sheet { max-height: 100vh; max-height: 100dvh; border-radius: 0; } }
        @media (max-width: 380px) { .kp-two { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- ============================================================
         KELOMPOK 2: HEADER & DAFTAR KARTU
         Fungsi: tombol kembali, judul, tombol "+ Pengganti". Kartu diisi karyawan-pengganti.js.
         PERLU DICEK: tujuan tombol kembali.
         ============================================================ -->
    <div class="app-container kp-page">
        <header class="page-header">
            <a href="../laporan.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h1>Karyawan Pengganti</h1>
            <button type="button" class="kp-btn-new" id="btnBuat"><i class="fa-solid fa-plus"></i> Pengganti</button>
        </header>

        <div class="kp-list" id="kpList"></div>
    </div>

    <!-- ============================================================
         KELOMPOK 3: MODAL FORM (Tambah / Detail / Edit)
         Fungsi: satu modal untuk tiga mode (diatur JS). Karyawan Absen hanya tampil untuk
         tipe Pengganti; Mitra dan Area hanya untuk tipe Casual.
         ============================================================ -->
    <div class="kp-modal" id="kpModal" role="dialog" aria-modal="true" aria-labelledby="kpTitle">
        <div class="kp-sheet">
            <div class="kp-sheet-head">
                <h2 class="kp-sheet-title" id="kpTitle">Tambah Pengganti</h2>
                <button type="button" class="kp-icon-btn" id="kpBtnX" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="kp-sheet-body" id="kpBody">
                <div class="kp-msg" id="kpMsg" hidden></div>
                <div class="kp-msg info" id="kpNote" hidden></div>

                <div class="kp-field">
                    <label class="kp-label" for="fTgl">Tanggal <span class="kp-req">*</span></label>
                    <div class="kp-tap" id="tapTgl">
                        <input type="text" class="kp-input" id="fTgl" readonly inputmode="none" placeholder="Pilih tanggal" data-value="">
                        <i class="fa-regular fa-calendar kp-tap-icon"></i>
                    </div>
                </div>

                <div class="kp-field">
                    <label class="kp-label" for="fTipe">Tipe Tugas <span class="kp-req">*</span></label>
                    <select class="kp-input" id="fTipe">
                        <option value="Pengganti">Pengganti</option>
                        <option value="Casual">Casual</option>
                    </select>
                </div>

                <!-- Hanya tipe Pengganti -->
                <div class="kp-field" id="wrapAbsen">
                    <div class="kp-combo">
                        <label class="kp-label" for="fAbsen">Karyawan Absen <span class="kp-req">*</span></label>
                        <div class="kp-tap" id="tapAbsen" data-combo="fAbsen">
                            <input type="text" class="kp-input" id="fAbsen" readonly inputmode="none" placeholder="Pilih karyawan yang absen" data-value="">
                            <i class="fa-solid fa-chevron-down kp-tap-icon"></i>
                        </div>
                        <div class="kp-combo-panel" id="fAbsenPanel" hidden>
                            <input type="search" class="kp-input kp-combo-search" id="fAbsenSearch" data-combo="fAbsen" placeholder="Cari NIK atau nama" autocomplete="off">
                            <div class="kp-combo-list" id="fAbsenList"></div>
                        </div>
                    </div>
                    <div class="kp-hint">Karyawan PKWT / PKWTT di departemen Anda.</div>
                </div>

                <!-- Hanya tipe Casual -->
                <div class="kp-two" id="wrapCasual" hidden>
                    <div class="kp-field">
                        <label class="kp-label" for="fMitra">Mitra <span class="kp-req">*</span></label>
                        <select class="kp-input" id="fMitra"><option value="">Pilih Mitra</option></select>
                    </div>
                    <div class="kp-field">
                        <label class="kp-label" for="fArea">Area <span class="kp-req">*</span></label>
                        <select class="kp-input" id="fArea"><option value="">Pilih Area</option></select>
                    </div>
                </div>

                <div class="kp-field">
                    <label class="kp-label" for="fShift">Shift Kerja <span class="kp-req">*</span></label>
                    <select class="kp-input" id="fShift"><option value="">Pilih Shift Kerja</option></select>
                </div>

                <div class="kp-field">
                    <div class="kp-combo">
                        <label class="kp-label" for="fBertugas">Karyawan Bertugas <span class="kp-req">*</span></label>
                        <div class="kp-tap" id="tapBertugas" data-combo="fBertugas">
                            <input type="text" class="kp-input" id="fBertugas" readonly inputmode="none" placeholder="Pilih karyawan bertugas" data-value="">
                            <i class="fa-solid fa-chevron-down kp-tap-icon"></i>
                        </div>
                        <div class="kp-combo-panel" id="fBertugasPanel" hidden>
                            <input type="search" class="kp-input kp-combo-search" id="fBertugasSearch" data-combo="fBertugas" placeholder="Cari NIK atau nama" autocomplete="off">
                            <div class="kp-combo-list" id="fBertugasList"></div>
                        </div>
                    </div>
                    <div class="kp-hint">Karyawan Reliver di departemen Anda.</div>
                </div>
            </div>

            <div class="kp-sheet-foot">
                <button type="button" class="kp-btn" id="kpBtnTutup" hidden>Tutup</button>
                <button type="button" class="kp-btn" id="kpBtnBatal" hidden>Batal</button>
                <button type="button" class="kp-btn primary" id="kpBtnEdit" hidden><i class="fa-solid fa-pen"></i> Edit</button>
                <button type="button" class="kp-btn primary" id="kpBtnSimpan" hidden><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         KELOMPOK 4: PEMILIH TANGGAL
         Fungsi: kalender yang muncul di atas modal saat kolom Tanggal diketuk.
         Tanggal yang tidak boleh dipilih berwarna abu-abu.
         ============================================================ -->
    <div class="kp-modal kp-top" id="kpDate" role="dialog" aria-modal="true" aria-labelledby="kpDateTitle">
        <div class="kp-sheet">
            <div class="kp-sheet-head">
                <h2 class="kp-sheet-title" id="kpDateTitle">Pilih tanggal</h2>
                <button type="button" class="kp-link-btn" id="kpDateOk">Simpan</button>
                <button type="button" class="kp-icon-btn" id="kpDateX" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="kp-sheet-body"><div class="kp-cal" id="kpDateCal"></div></div>
        </div>
    </div>

    <div class="kp-toast" id="kpToast"></div>

    <!-- ============================================================
         KELOMPOK 5: SCRIPT
         PERLU DICEK: path supabase.js dan karyawan-pengganti.js. Samakan dengan
         halaman PWA lain di folder yang sama (mis. permintaan-barang.html).
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/report/karyawan-pengganti.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../../sw.js').catch((err) => console.error('[Service Worker] Gagal:', err));
            });
        }
    </script>
</body>
</html>
