<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DMB ERP - Inbox</title>

  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">

  <style>
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--card-bg);
    }
    .page-header .back-btn { font-size: 1.1rem; color: var(--dark-color); }
    .page-header h1 { font-size: 1rem; font-weight: 700; color: var(--dark-color); }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: var(--card-bg);
    }
    .tab-item {
      flex: 1;
      text-align: center;
      padding: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      position: relative;
    }
    .tab-item.active {
      color: #0d6efd;
      border-bottom-color: #0d6efd;
    }
    .tab-badge {
      background: #dc2626;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
      display: none;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      padding: 60px 24px;
    }
    .empty-state i {
      font-size: 2rem;
      display: block;
      margin-bottom: 12px;
      color: var(--border-color);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="page-header">
      <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <h1>Inbox</h1>
    </header>

    <div class="tab-bar">
      <div class="tab-item active" data-tab="notifikasi">
        Notifikasi <span class="tab-badge" id="badgeNotifikasi">0</span>
      </div>
      <div class="tab-item" data-tab="persetujuan">
        Persetujuan <span class="tab-badge" id="badgePersetujuan">0</span>
      </div>
    </div>

    <div class="tab-content active" id="tabNotifikasi">
      <div class="empty-state">
        <i class="fa-regular fa-bell-slash"></i>
        Belum ada notifikasi.
      </div>
    </div>

    <div class="tab-content" id="tabPersetujuan">
      <div class="empty-state">
        <i class="fa-regular fa-circle-check"></i>
        Belum ada pengajuan yang perlu disetujui.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/inbox.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js')
          .then((reg) => console.log('[Service Worker] Terdaftar:', reg.scope))
          .catch((err) => console.error('[Service Worker] Gagal:', err));
      });
    }
  </script>
</body>
</html>
