<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Patroli - DMB Security</title>

    <!-- ============================================================
         KELOMPOK 1: STYLE
         Fungsi: seluruh gaya halaman, ditulis di sini tanpa library eksternal
         (ikon memakai karakter/SVG sendiri) supaya tetap tampil saat offline.
         Prefix "pt-" = patroli.
         ============================================================ -->
    <style>
        :root {
            --pt-success: #16a34a;
            --pt-warning: #d97706;
            --pt-danger: #dc2626;
            --pt-info: #2563eb;
            --pt-text: #ffffff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%; margin: 0; background: #000; color: var(--pt-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; overscroll-behavior: none;
        }

        /* --- Kamera layar penuh --- */
        #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

        /* --- Bingkai bidik: area gelap di luar bingkai dibuat dengan bayangan --- */
        .pt-frame {
            position: fixed; left: 50%; top: 46%; width: min(70vw, 320px); aspect-ratio: 1;
            transform: translate(-50%, -50%); border-radius: 18px;
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.5); pointer-events: none;
        }
        .pt-frame i { position: absolute; width: 30px; height: 30px; border: 4px solid #fff; }
        .pt-frame i:nth-child(1) { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 18px; }
        .pt-frame i:nth-child(2) { top: -2px; right: -2px; border-left: none; border-bottom: none; border-top-right-radius: 18px; }
        .pt-frame i:nth-child(3) { bottom: -2px; left: -2px; border-right: none; border-top: none; border-bottom-left-radius: 18px; }
        .pt-frame i:nth-child(4) { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 18px; }
        .pt-hint {
            position: fixed; left: 0; right: 0; top: calc(46% + min(35vw, 160px) + 24px);
            text-align: center; font-size: 14px; padding: 0 24px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        /* --- Bar atas: nama petugas + status jaringan/antrean --- */
        .pt-top {
            position: fixed; top: 0; left: 0; right: 0; z-index: 20;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0));
        }
        .pt-user { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pt-pill {
            display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.45); color: #fff; border-radius: 999px; padding: 7px 12px;
            font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; flex-shrink: 0;
        }
        .pt-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pt-success); }
        .pt-dot.off { background: var(--pt-danger); }
        .pt-badge {
            min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--pt-warning);
            font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
        }
        .pt-badge[hidden] { display: none; }

        /* --- Notifikasi hasil scan --- */
        .pt-toast {
            position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); z-index: 30;
            display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 16px;
            background: var(--pt-success); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            max-width: 520px; margin: 0 auto;
        }
        .pt-toast[hidden] { display: none; }
        .pt-toast.warning { background: var(--pt-warning); }
        .pt-toast.error { background: var(--pt-danger); }
        .pt-toast-icon {
            width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.25);
            display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex-shrink: 0;
        }
        .pt-toast-title { font-size: 17px; font-weight: 700; line-height: 1.2; }
        .pt-toast-sub { font-size: 13.5px; opacity: 0.95; margin-top: 3px; word-break: break-word; }

        /* --- Layar pesan penuh (kamera tidak bisa dibuka, sesi tidak ada, dll) --- */
        .pt-block {
            position: fixed; inset: 0; z-index: 50; background: #0b1220;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 32px; gap: 12px;
        }
        .pt-block[hidden] { display: none; }
        .pt-block h1 { margin: 0; font-size: 20px; }
        .pt-block p { margin: 0; font-size: 14.5px; line-height: 1.55; opacity: 0.85; max-width: 420px; }
        .pt-btn {
            margin-top: 8px; padding: 12px 22px; border-radius: 12px; border: none; background: var(--pt-info);
            color: #fff; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
        }
        .pt-btn.plain { background: rgba(255, 255, 255, 0.14); }
        .pt-btn:disabled { opacity: 0.6; }

        /* --- Lembar riwayat scan --- */
        .pt-sheet-overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end; justify-content: center; }
        .pt-sheet-overlay[hidden] { display: none; }
        .pt-sheet {
            width: 100%; max-width: 560px; max-height: 80%; display: flex; flex-direction: column;
            background: #fff; color: #1f2d3d; border-radius: 18px 18px 0 0; overflow: hidden;
        }
        .pt-sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #e2e8f0; }
        .pt-sheet-head h2 { margin: 0; font-size: 17px; }
        .pt-sheet-close { border: none; background: none; font-size: 22px; color: #64748b; cursor: pointer; padding: 4px 8px; }
        .pt-sheet-status { padding: 10px 18px; font-size: 13.5px; background: #f1f5f9; color: #334155; }
        .pt-sheet-list { overflow-y: auto; flex: 1; padding: 4px 0; }
        .pt-item { padding: 11px 18px; border-bottom: 1px solid #eef2f7; }
        .pt-item-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; }
        .pt-item-time { font-size: 12.5px; color: #64748b; font-weight: 400; white-space: nowrap; }
        .pt-item-state { margin-top: 4px; font-size: 12.5px; font-weight: 600; }
        .pt-item-state.synced { color: var(--pt-success); }
        .pt-item-state.pending { color: var(--pt-warning); }
        .pt-item-state.rejected { color: var(--pt-danger); }
        .pt-empty { padding: 28px 18px; text-align: center; color: #64748b; font-size: 14px; }
        .pt-sheet-foot { padding: 12px 18px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid #e2e8f0; }
        .pt-sheet-foot .pt-btn { width: 100%; margin: 0; }
    </style>
</head>
<body>

    <!-- ============================================================
         KELOMPOK 2: KAMERA
         Fungsi: tampilan kamera belakang layar penuh (diatur patroli.js).
         "canvas" hanya dipakai sebagai area kerja pembaca QR dan tidak ditampilkan.
         ============================================================ -->
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="frameCanvas" hidden></canvas>

    <div class="pt-frame"><i></i><i></i><i></i><i></i></div>
    <div class="pt-hint" id="hint">Arahkan kamera ke QR Code titik patroli</div>

    <!-- ============================================================
         KELOMPOK 3: BAR ATAS
         Fungsi: nama petugas (kiri) dan tombol status (kanan): titik hijau =
         online, merah = offline, angka oranye = jumlah scan yang belum terkirim.
         Menekan tombol ini membuka riwayat scan.
         ============================================================ -->
    <header class="pt-top">
        <div class="pt-user" id="userLabel">-</div>
        <button type="button" class="pt-pill" id="btnStatus" aria-label="Riwayat scan">
            <span class="pt-dot" id="netDot"></span>
            <span id="netText">Online</span>
            <span class="pt-badge" id="pendingBadge" hidden>0</span>
        </button>
    </header>

    <!-- ============================================================
         KELOMPOK 4: NOTIFIKASI
         Fungsi: kartu hasil scan (hijau = berhasil, oranye = peringatan,
         merah = gagal) yang hilang sendiri, lalu kamera siap scan lagi.
         ============================================================ -->
    <div class="pt-toast" id="toast" hidden role="status" aria-live="polite">
        <div class="pt-toast-icon" id="toastIcon">✓</div>
        <div>
            <div class="pt-toast-title" id="toastTitle"></div>
            <div class="pt-toast-sub" id="toastSub"></div>
        </div>
    </div>

    <!-- ============================================================
         KELOMPOK 5: LAYAR PESAN PENUH
         Fungsi: menggantikan kamera saat ada masalah (sesi login tidak ada,
         izin kamera ditolak, kamera tidak tersedia).
         ============================================================ -->
    <div class="pt-block" id="block" hidden>
        <h1 id="blockTitle"></h1>
        <p id="blockText"></p>
        <button type="button" class="pt-btn" id="blockBtn">Coba Lagi</button>
    </div>

    <!-- ============================================================
         KELOMPOK 6: RIWAYAT SCAN
         Fungsi: daftar scan terbaru dan statusnya (terkirim / menunggu /
         ditolak server) serta tombol "Kirim Sekarang" untuk antrean offline.
         ============================================================ -->
    <div class="pt-sheet-overlay" id="sheet" hidden>
        <div class="pt-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="pt-sheet-head">
                <h2 id="sheetTitle">Riwayat Scan</h2>
                <button type="button" class="pt-sheet-close" id="btnSheetClose" aria-label="Tutup">×</button>
            </div>
            <div class="pt-sheet-status" id="sheetStatus"></div>
            <div class="pt-sheet-list" id="sheetList"></div>
            <div class="pt-sheet-foot">
                <button type="button" class="pt-btn" id="btnSyncNow">Kirim Sekarang</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         KELOMPOK 7: SCRIPT
         Fungsi: jsQR (pembaca QR cadangan untuk browser tanpa BarcodeDetector,
         misalnya iPhone), Supabase (database), lalu skrip halaman.
         PERLU DICEK:
         1. Path supabase.js dan patroli.js, samakan dengan struktur folder PWA Anda.
         2. Agar halaman ini bisa DIBUKA saat offline, file ini, patroli.js,
            supabase.js, dan kedua library CDN di bawah harus ikut disimpan oleh
            service worker PWA Anda (atau library disalin ke folder proyek).
            Tanpa itu, scan offline hanya jalan jika halaman sudah terbuka
            sebelum sinyal hilang.
         ============================================================ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/patroli.js"></script>
</body>
</html>
