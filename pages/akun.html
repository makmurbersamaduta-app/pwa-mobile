<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DMB ERP - Akun</title>

  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">

  <style>
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--card-bg);
    }
    .page-header .back-btn { font-size: 1.1rem; color: var(--dark-color); }
    .page-header h1 { font-size: 1rem; font-weight: 700; color: var(--dark-color); }

    /* Kartu Profil */
    .profile-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin: 16px;
    }
    .profile-card img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      background: #e2e8f0;
    }
    .profile-card .profile-name { font-size: 0.95rem; font-weight: 700; color: var(--dark-color); }
    .profile-card .profile-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    .group-section { padding: 0 16px 0; }
    .group-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .group-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .menu-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      min-height: 52px;
      text-decoration: none;
      color: var(--dark-color);
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      font-family: inherit;
      text-align: left;
    }
    .menu-row:last-child { border-bottom: none; }
    .menu-row i { width: 20px; text-align: center; color: #0d6efd; font-size: 1rem; }
    .menu-row span { font-size: 0.85rem; font-weight: 600; }
    .menu-row .chevron { margin-left: auto; color: var(--text-muted); font-size: 0.8rem; }

    .menu-row.danger span,
    .menu-row.danger i { color: #dc2626; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      padding: 40px 16px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="page-header">
      <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <h1>Akun</h1>
    </header>

    <div class="profile-card">
      <img src="../assets/images/logo-dmb.png" alt="Foto Profil" id="profileAvatar" onerror="this.src='https://via.placeholder.com/56'">
      <div>
        <div class="profile-name" id="profileName">Nama Karyawan</div>
        <div class="profile-sub" id="profileSub">Username</div>
      </div>
    </div>

    <div id="akunGroups">
      <!-- Diisi dinamis oleh js/akun.js -->
    </div>

    <div class="group-section">
      <div class="group-title">Pengaturan</div>
      <div class="group-card">
        <a href="akun/ubah-password.html" class="menu-row">
          <i class="fa-solid fa-key"></i>
          <span>Ubah Password</span>
          <i class="fa-solid fa-chevron-right chevron"></i>
        </a>
        <button type="button" class="menu-row danger" id="btnLogout">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Keluar</span>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/menu-engine.js"></script>
  <script src="../js/akun.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js')
          .then((reg) => console.log('[Service Worker] Terdaftar:', reg.scope))
          .catch((err) => console.error('[Service Worker] Gagal:', err));
      });
    }
  </script>
</body>
</html>
